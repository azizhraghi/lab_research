name: lrste-demo
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: laboratory
    volumes: ["demo_database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d laboratory"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["demo_events:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://lab:local-demo-only@db:5432/laboratory
      ENVIRONMENT: development
      DISABLE_AUTH: "true"
      CREATE_SCHEMA_ON_STARTUP: "false"
      EVENT_BUS_TYPE: redis
      REDIS_HOST: redis
      VEILLE_SCHEDULER_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      MISTRAL_API_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 90s
      retries: 20
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  demo_database:
  demo_events:
